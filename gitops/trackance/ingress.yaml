apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trackance
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - aks.labs.trackance.co.uk
      secretName: trackance-tls
  rules:
    - host: aks.labs.trackance.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trackance
                port:
                  number: 80