apiVersion: apps/v1
kind: Deployment
metadata:
  name: trackance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trackance
  template:
    metadata:
      labels:
        app: trackance
    spec:
      containers:
        - name: trackance
          image: trackanceaksacr.azurecr.io/trackance:3d9d545d8fe9a0cacb4d0413341f54b1376289f2
          ports:
            - containerPort: 3000