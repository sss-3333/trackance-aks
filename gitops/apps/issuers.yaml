apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: issuers
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sss-3333/trackance-aks.git
    targetRevision: main
    path: gitops/issuers
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 30s