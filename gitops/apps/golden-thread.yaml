apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: golden-thread
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sss-3333/golden-thread.git
    targetRevision: main
    path: gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: golden-thread
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true